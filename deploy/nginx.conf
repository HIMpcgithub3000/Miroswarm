server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    absolute_redirect off;

    # Miro Swarm Lab API & Swagger Documentation
    location /swarm-docs {
        proxy_pass http://127.0.0.1:3001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:3001/openapi.json;
        proxy_set_header Host $host;
    }

    location /swarm-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # MiroFish Backend API
    location /mirofish/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /mirofish-api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # Ecosystem Guard Downstream Application
    location /guard/api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guard/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MiroFish Engine UI (Static Production Build)
    location /mirofish/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /mirofish/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /mirofish {
        return 301 /mirofish/;
    }

    # Default Root Redirects to MiroFish
    location = / {
        return 302 /mirofish/;
    }

    location / {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /mirofish/index.html;
    }
}
